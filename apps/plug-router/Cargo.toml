[package]
name = "plug-router-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Cross-platform smart-plug application for parent routers and always-on end devices"

[features]
default = []
router = ["router-app/router", "zigbee-runtime/router"]

[dependencies]
router-app.workspace = true
zigbee-mac.workspace = true
zigbee-plug-controller.workspace = true
zigbee-plug-core.workspace = true
zigbee-plug-profile.workspace = true
zigbee-runtime.workspace = true

[dev-dependencies]
zigbee-aps.workspace = true
zigbee-mac = { workspace = true, features = ["mock"] }
zigbee-nwk.workspace = true
zigbee-types.workspace = true
zigbee-zcl.workspace = true

[[test]]
name = "lifecycle"
required-features = ["router"]

[lints]
workspace = true
