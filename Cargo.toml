[workspace]
resolver = "2"
members = [
    "apps/plug-router",
    "boards/*",
    "drivers/*",
    "examples/mock-plug",
    "plug-controller",
    "plug-core",
    "plug-hardware",
    "plug-storage",
    "products/*",
    "zigbee-plug-profile",
]
# `firmware/tlsr8258-plug` is a `no_std`/`no_main` tc32 binary crate with its
# own `.cargo/config.toml` (hardcoded `tc32-unknown-none-elf` target and
# `-Z build-std`), exactly like zigbee-rs's own
# `examples/telink-tlsr8258-router`. Keeping it out of this workspace means
# plain `cargo build/test/clippy/doc --workspace` (this repo's host CI)
# never tries to cross-compile it or inherit its target override; it is
# built/checked only through `scripts/tlsr8258-firmware.sh` or the
# `build-tc32.yml` workflow, from its own directory.
exclude = ["firmware/tlsr8258-plug"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faronov/zigbee-rs-plugs"
rust-version = "1.88"

[workspace.dependencies]
bl0937 = { path = "drivers/bl0937" }
bl0942 = { path = "drivers/bl0942" }
tlsr8258-legacy-bl0937 = { path = "boards/tlsr8258-legacy-bl0937" }
tlsr8258-ts011f-bl0942 = { path = "boards/tlsr8258-ts011f-bl0942" }
tlsr8258-zbeacon-ts011f-bl0937 = { path = "boards/tlsr8258-zbeacon-ts011f-bl0937" }
zigbee-plug-controller = { path = "plug-controller" }
zigbee-plug-core = { path = "plug-core" }
zigbee-plug-hardware = { path = "plug-hardware" }
zigbee-plug-profile = { path = "zigbee-plug-profile" }
zigbee-plug-storage = { path = "plug-storage" }
embedded-storage = "0.3"
efr32mg21-hal = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
heapless = "0.9"
router-app = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d", default-features = false }
static_cell = "2"
tlsr8258-hal = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
tlsr8258-rt = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
# Shared application/profile crates only need the platform-neutral trait.
# Each standalone firmware root selects exactly its own backend/AES features.
zigbee-mac = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
zigbee-nwk = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
zigbee-aps = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
zigbee-crypto = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
# Shared crates stay role-neutral. Parent firmware enables `router` through
# `plug-router-app/router`; the EFR32 proof therefore carries no routing,
# parent, or child-table capacities.
zigbee-runtime = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d", default-features = false }
zigbee-types = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d" }
zigbee-zcl = { git = "https://github.com/faronov/zigbee-rs.git", rev = "14ba6df7309602cc31a08e97667c732d61b9580d", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
