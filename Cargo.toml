[workspace]
resolver = "2"
members = [
    "boards/*",
    "drivers/*",
    "examples/mock-plug",
    "plug-controller",
    "plug-core",
    "plug-hardware",
    "plug-storage",
    "products/*",
    "zigbee-plug-profile",
]
# `firmware/tlsr8258-plug` is a `no_std`/`no_main` tc32 binary crate with its
# own `.cargo/config.toml` (hardcoded `tc32-unknown-none-elf` target and
# `-Z build-std`), exactly like zigbee-rs's own
# `examples/telink-tlsr8258-router`. Keeping it out of this workspace means
# plain `cargo build/test/clippy/doc --workspace` (this repo's host CI)
# never tries to cross-compile it or inherit its target override; it is
# built/checked only through `scripts/tlsr8258-firmware.sh` or the
# `build-tc32.yml` workflow, from its own directory.
exclude = ["firmware/tlsr8258-plug"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/faronov/zigbee-rs-plugs"
rust-version = "1.88"

[workspace.dependencies]
bl0937 = { path = "drivers/bl0937" }
bl0942 = { path = "drivers/bl0942" }
tlsr8258-legacy-bl0937 = { path = "boards/tlsr8258-legacy-bl0937" }
tlsr8258-ts011f-bl0942 = { path = "boards/tlsr8258-ts011f-bl0942" }
tlsr8258-zbeacon-ts011f-bl0937 = { path = "boards/tlsr8258-zbeacon-ts011f-bl0937" }
zigbee-plug-controller = { path = "plug-controller" }
zigbee-plug-core = { path = "plug-core" }
zigbee-plug-hardware = { path = "plug-hardware" }
zigbee-plug-profile = { path = "zigbee-plug-profile" }
zigbee-plug-storage = { path = "plug-storage" }
embedded-storage = "0.3"
heapless = "0.9"
tlsr8258-hal = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a" }
tlsr8258-rt = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a" }
zigbee-mac = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a" }
zigbee-nwk = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a" }
# `default-features = false` drops the upstream `float32`/`float64` ZCL
# defaults: no smart-plug cluster in this workspace carries a float ZCL
# attribute (voltage/current/power/energy are all integer-scaled — see
# `zigbee-plug-profile`), so the float codec is dead weight here. `router`
# is the only feature these images need. This mirrors zigbee-rs's own
# `examples/telink-tlsr8258-router` dependency wiring exactly; it is *not*
# a size hack that weakens routing — `constrained-memory` is deliberately
# left off so no parent/child table is shrunk.
zigbee-runtime = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a", default-features = false, features = ["router"] }
zigbee-types = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a" }
zigbee-zcl = { git = "https://github.com/faronov/zigbee-rs.git", rev = "442b55e24ac4e4ad514708325770722b7941dc7a", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_arch, values("tc32"))'] }

[workspace.lints.clippy]
all = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
