name: Build TLSR8258 (tc32)

# Matrix-builds every one of `firmware/tlsr8258-plug`'s six product
# features against the modern-tc32 toolchain, using this repository's own
# `scripts/tlsr8258-firmware.sh` for the build, its post-link
# partition/RAM/cache/RF-DMA layout check, the typed-`Router` symbol gate
# (parent path present; End Device Timeout client + EndDevice/RelayRouter
# roles absent), and the per-product `*.size.json` (image size, app-NV
# budget, headroom, sha256). Every artifact this workflow uploads is
# EXPERIMENTAL: no image built here has been run on TLSR8258 hardware (see
# docs/safety.md) — this workflow never flashes a device and has no `flash`
# job.
#
# Host CI (`.github/workflows/ci.yml`) is a separate workflow and is not
# affected by this one: `firmware/tlsr8258-plug` stays excluded from the
# root workspace (see the root `Cargo.toml`'s `exclude` comment), so this
# job's tc32 cross-build can never influence `cargo build/test/clippy/doc
# --workspace`.

on:
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "apps/**"
      - "firmware/tlsr8258-plug/**"
      - "link/**"
      - "scripts/tlsr8258-firmware.sh"
      - "boards/**"
      - "products/**"
      - "drivers/**"
      - "plug-core/**"
      - "plug-hardware/**"
      - "plug-storage/**"
      - "plug-controller/**"
      - "zigbee-plug-profile/**"
      - ".github/workflows/build-tc32.yml"
  pull_request:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "apps/**"
      - "firmware/tlsr8258-plug/**"
      - "link/**"
      - "scripts/tlsr8258-firmware.sh"
      - "boards/**"
      - "products/**"
      - "drivers/**"
      - "plug-core/**"
      - "plug-hardware/**"
      - "plug-storage/**"
      - "plug-controller/**"
      - "zigbee-plug-profile/**"
      - ".github/workflows/build-tc32.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tc32-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Same modern-tc32 toolchain release this repository's
  # `scripts/tlsr8258-firmware.sh` (and zigbee-rs's own tc32 CI) build
  # against.
  TC32_TOOLCHAIN_URL: https://github.com/modern-tc32/rust/releases/download/tc32-stage2-tc32-45/tc32-rust-toolchain-linux-amd64.tar.gz
  TC32_TOOLCHAIN_SHA256: 916732a6f5e19da722e735cb267192dbd5dda155f0701287fab52a54b852c9b7
  TC32_TOOLCHAIN_DIR: ${{ github.workspace }}/.toolchains/tc32-stage2-tc32-45

jobs:
  build:
    name: ${{ matrix.feature }} (${{ matrix.layout }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zigbee-rs-plugs
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: tz3000-gjnozsaz-1m
            layout: 1m
          - feature: tz3000-gjnozsaz-512k
            layout: 512k
          - feature: tz3000-w0qqde0g
            layout: 1m
          - feature: tz3000-zloso4jk
            layout: 1m
          - feature: legacy-bl0937-pd6
            layout: 1m
          - feature: zbeacon-ts011f-512k
            layout: 512k

    steps:
      - name: Checkout plugs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, recorded 2026-08-25
        with:
          path: zigbee-rs-plugs
          persist-credentials: false

      - name: Cache tc32-45 toolchain
        id: cache-tc32-toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, recorded 2026-08-25
        with:
          path: ${{ env.TC32_TOOLCHAIN_DIR }}
          key: tc32-toolchain-linux-amd64-${{ env.TC32_TOOLCHAIN_SHA256 }}

      - name: Install tc32-45 toolchain
        if: steps.cache-tc32-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TC32_TOOLCHAIN_DIR"
          curl --proto '=https' --tlsv1.2 -fL --retry 3 \
            "$TC32_TOOLCHAIN_URL" -o /tmp/tc32.tar.gz
          echo "$TC32_TOOLCHAIN_SHA256  /tmp/tc32.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tc32.tar.gz --strip-components=1 -C "$TC32_TOOLCHAIN_DIR"

      - name: Verify tc32-45 toolchain
        run: |
          "$TC32_TOOLCHAIN_DIR/bin/rustc" --version --verbose
          "$TC32_TOOLCHAIN_DIR/bin/cargo" --version --verbose

      # The compiler cache is keyed by the verified archive digest above.
      # Do not cache target/ or OUT_DIR linker scripts; only immutable Cargo
      # dependency downloads are reused below.
      - name: Cache Cargo dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, recorded 2026-08-25
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-tc32-stage2-tc32-45-tc32-unknown-none-elf-${{ matrix.layout }}-${{ matrix.feature }}-${{ hashFiles('zigbee-rs-plugs/firmware/tlsr8258-plug/Cargo.lock', 'zigbee-rs-plugs/firmware/tlsr8258-plug/Cargo.toml', 'zigbee-rs-plugs/rust-toolchain.toml') }}

      - name: Build, layout + symbol gate, size metadata (EXPERIMENTAL, not hardware-proven)
        run: |
          ./scripts/tlsr8258-firmware.sh build \
            firmware/tlsr8258-plug tlsr8258-plug \
            "${{ matrix.layout }}" "${{ matrix.feature }}"

      - name: Rename artifacts by product slug
        run: |
          mkdir -p target/tlsr8258-artifacts
          cp "target/tc32-unknown-none-elf/release/tlsr8258-plug" \
            "target/tlsr8258-artifacts/tlsr8258-plug-${{ matrix.feature }}.elf"
          cp "target/tc32-unknown-none-elf/release/tlsr8258-plug.bin" \
            "target/tlsr8258-artifacts/tlsr8258-plug-${{ matrix.feature }}.bin"
          # Size/budget/headroom + sha256 metadata emitted by the build
          # script's layout check (EXPERIMENTAL — see docs/safety.md).
          cp "target/tc32-unknown-none-elf/release/tlsr8258-plug.size.json" \
            "target/tlsr8258-artifacts/tlsr8258-plug-${{ matrix.feature }}.size.json"
          echo "::group::${{ matrix.feature }} size.json"
          cat "target/tlsr8258-artifacts/tlsr8258-plug-${{ matrix.feature }}.size.json"
          echo "::endgroup::"

      - name: Upload experimental firmware image + size metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, recorded 2026-08-25
        with:
          name: tlsr8258-plug-${{ matrix.feature }}-${{ github.sha }}
          path: |
            zigbee-rs-plugs/target/tlsr8258-artifacts/*.elf
            zigbee-rs-plugs/target/tlsr8258-artifacts/*.bin
            zigbee-rs-plugs/target/tlsr8258-artifacts/*.size.json
          if-no-files-found: error
          retention-days: 30
