name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  host:
    name: Workspace host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zigbee-rs-plugs
    steps:
      - name: Checkout plugs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, recorded 2026-08-25
        with:
          path: zigbee-rs-plugs
          persist-credentials: false

      - name: Install recorded Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt

      # Cache only immutable dependency downloads. Target directories contain
      # generated linker inputs for the embedded crates and are intentionally
      # rebuilt from the checked-out manifests/linker scripts.
      - name: Cache Cargo dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, recorded 2026-08-25
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-rust-1.98.0-x86_64-unknown-linux-gnu-workspace-default-${{ hashFiles('zigbee-rs-plugs/Cargo.lock', 'zigbee-rs-plugs/Cargo.toml', 'zigbee-rs-plugs/rust-toolchain.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

      - name: Build release workspace
        run: cargo build --workspace --release --locked

      - name: Test workspace
        run: cargo test --workspace --locked

      - name: Test parent-router application mode
        run: cargo test -p plug-router-app --features router --locked

      - name: Clippy workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Clippy parent-router application mode
        run: cargo clippy -p plug-router-app --all-targets --features router --locked -- -D warnings

      - name: Document workspace
        run: cargo doc --workspace --no-deps --locked

  efr32-proof:
    name: EFR32MG21 plug proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: zigbee-rs-plugs
    steps:
      - name: Checkout plugs
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, recorded 2026-08-25
        with:
          path: zigbee-rs-plugs
          persist-credentials: false

      - name: Install recorded Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.98.0
          targets: thumbv8m.main-none-eabihf
          components: rustfmt

      - name: Cache Cargo dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4, recorded 2026-08-25
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-rust-1.98.0-thumbv8m.main-none-eabihf-plug-efr32-proof-default-${{ hashFiles('zigbee-rs-plugs/firmware/plug-efr32-proof/Cargo.lock', 'zigbee-rs-plugs/firmware/plug-efr32-proof/Cargo.toml', 'zigbee-rs-plugs/rust-toolchain.toml') }}

      - name: Install ARM ELF inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-arm-none-eabi

      - name: Check proof formatting
        working-directory: zigbee-rs-plugs/firmware/plug-efr32-proof
        run: cargo fmt -- --check

      - name: Build locked EFR32 proof release
        working-directory: zigbee-rs-plugs/firmware/plug-efr32-proof
        run: cargo build --release --locked

      - name: Verify proof and create firmware artifacts
        run: |
          ELF=firmware/plug-efr32-proof/target/thumbv8m.main-none-eabihf/release/plug-efr32-proof
          python3 firmware/plug-efr32-proof/tools/verify-proof.py "$ELF"
          arm-none-eabi-objcopy -O binary "$ELF" "${ELF}.bin"
          arm-none-eabi-objcopy -O ihex "$ELF" "${ELF}.hex"
          arm-none-eabi-size "$ELF"

      - name: Upload EFR32 proof artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, recorded 2026-08-25
        with:
          name: plug-efr32-proof-${{ github.sha }}
          path: |
            zigbee-rs-plugs/firmware/plug-efr32-proof/target/thumbv8m.main-none-eabihf/release/plug-efr32-proof
            zigbee-rs-plugs/firmware/plug-efr32-proof/target/thumbv8m.main-none-eabihf/release/plug-efr32-proof.bin
            zigbee-rs-plugs/firmware/plug-efr32-proof/target/thumbv8m.main-none-eabihf/release/plug-efr32-proof.hex
          if-no-files-found: error
          retention-days: 30
